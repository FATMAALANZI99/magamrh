<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مغامرة جوهرة الغابة | Fatima Alenezi</title>
<style>
:root{--ink:#202744;--teal:#359c91;--purple:#6554d9;--bg:#f6f7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{width:min(960px,100%)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}h1{margin:0;font-size:clamp(1.4rem,4vw,2.2rem);color:var(--ink)}.tag{color:var(--teal);font-weight:bold}.panel{background:white;border:1px solid #e0e3ef;border-radius:18px;padding:14px;box-shadow:0 10px 30px #28305212}canvas{display:block;width:100%;height:auto;border-radius:12px;touch-action:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.stats{display:flex;gap:16px;flex-wrap:wrap;font-weight:bold}button{border:0;border-radius:12px;padding:11px 17px;background:var(--purple);color:white;font-size:1rem;font-weight:bold;cursor:pointer}.help{color:#667087;line-height:1.8}.pad{display:flex;gap:6px;align-items:center}.pad button{padding:9px 13px;background:#e9e6ff;color:#4e40bd}
</style></head><body><main class="wrap"><header><div><div class="tag">مشروع برمجي تجريبي</div><h1>💎 مغامرة جوهرة الغابة</h1></div><div class="tag">HTML • CSS • JavaScript</div></header>
<section class="panel"><canvas id="game" width="900" height="430" aria-label="لعبة مغامرة جوهرة الغابة"></canvas><div class="row"><div class="stats"><span>الجواهر: <b id="score">0</b>/5</span><span id="status">اجمعي الجواهر!</span></div><button id="restart">بدء / إعادة اللعبة</button><div class="pad"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div></div><p class="help">طريقة اللعب: استخدمي الأسهم أو WASD للتحرك، واجمعي الجواهر البنفسجية الخمس وتجنّبي الأشباح الوردية. على الهاتف استخدمي أزرار الاتجاهات.</p></section></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');let p,gems,ghosts,score,won;
function reset(){p={x:90,y:90,r:17};gems=[{x:250,y:90},{x:450,y:160},{x:720,y:90},{x:310,y:330},{x:730,y:330}].map(g=>({...g,got:false}));ghosts=[{x:530,y:280,dx:2.2,dy:0},{x:790,y:210,dx:0,dy:1.8},{x:160,y:330,dx:1.7,dy:0}];score=0;won=false;scoreEl.textContent=0;statusEl.textContent='اجمعي الجواهر!';draw()}
function move(dx,dy){if(won)return;p.x=Math.max(24,Math.min(876,p.x+dx));p.y=Math.max(24,Math.min(406,p.y+dy));for(const g of gems){if(!g.got&&Math.hypot(p.x-g.x,p.y-g.y)<29){g.got=true;score++;scoreEl.textContent=score;if(score===5){won=true;statusEl.textContent='أحسنتِ! فزتِ بالمغامرة 🎉'}}}for(const h of ghosts){if(Math.hypot(p.x-h.x,p.y-h.y)<31){statusEl.textContent='لمستِ شبحًا! حاولي مجددًا';p.x=90;p.y=90;break}}draw()}
function draw(){ctx.clearRect(0,0,900,430);ctx.fillStyle='#d9f4df';ctx.fillRect(0,0,900,430);
ctx.fillStyle='#ead9b1';ctx.beginPath();ctx.moveTo(320,430);ctx.lineTo(480,0);ctx.lineTo(565,0);ctx.lineTo(405,430);ctx.fill();
for(const t of [{x:70,y:90},{x:190,y:95},{x:350,y:95},{x:575,y:95},{x:790,y:95}]){ctx.fillStyle='#9b6b4b';ctx.fillRect(t.x-9,t.y+25,18,85);ctx.fillStyle='#53ad80';ctx.beginPath();ctx.ellipse(t.x,t.y,58,65,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#75c895';ctx.beginPath();ctx.ellipse(t.x,t.y-22,40,45,0,0,Math.PI*2);ctx.fill()}
for(const g of gems){if(g.got)continue;ctx.fillStyle='#6554d9';ctx.beginPath();ctx.moveTo(g.x,g.y-22);ctx.lineTo(g.x+20,g.y);ctx.lineTo(g.x,g.y+22);ctx.lineTo(g.x-20,g.y);ctx.closePath();ctx.fill();ctx.fillStyle='#a79cff';ctx.beginPath();ctx.moveTo(g.x,g.y-22);ctx.lineTo(g.x,g.y);ctx.lineTo(g.x-20,g.y);ctx.closePath();ctx.fill()}
for(const h of ghosts){ctx.fillStyle='#ed8197';ctx.beginPath();ctx.arc(h.x,h.y,21,Math.PI,0);ctx.lineTo(h.x+21,h.y+20);ctx.lineTo(h.x-21,h.y+20);ctx.closePath();ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(h.x-7,h.y-2,5,0,Math.PI*2);ctx.arc(h.x+7,h.y-2,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202744';ctx.beginPath();ctx.arc(h.x-7,h.y-2,2,0,Math.PI*2);ctx.arc(h.x+7,h.y-2,2,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#493ba7';ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd1a9';ctx.beginPath();ctx.arc(p.x,p.y-7,11,0,Math.PI*2);ctx.fill();
if(won){ctx.fillStyle='#202744dd';ctx.fillRect(0,0,900,430);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 34px Tahoma';ctx.fillText('فزتِ بالمغامرة!',450,205);ctx.font='22px Tahoma';ctx.fillText('جمعتِ كل الجواهر الخمس',450,245)}}
function animate(){ghosts.forEach(h=>{h.x+=h.dx;h.y+=h.dy;if(h.x<40||h.x>860)h.dx*=-1;if(h.y<40||h.y>390)h.dy*=-1});if(!won)draw();requestAnimationFrame(animate)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','w'].includes(k)){e.preventDefault();move(0,-18)}if(['arrowdown','s'].includes(k)){e.preventDefault();move(0,18)}if(['arrowleft','a'].includes(k)){e.preventDefault();move(-18,0)}if(['arrowright','d'].includes(k)){e.preventDefault();move(18,0)}});
document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('click',()=>move(d==='left'?-18:d==='right'?18:0,d==='up'?-18:d==='down'?18:0))});document.getElementById('restart').onclick=reset;reset();animate();
})();
</script></body></html>
